[application]
name = "Solochain Node"

[bundle]
identifier = "dev.solochain.node"
publisher = "solochain-node"

# Android packaging.
#
# - min_sdk 26 matches the `--platform 26` used to build the node binary
#   with `cargo ndk -t arm64-v8a --platform 26 build --release`.
# - The node binary itself is NOT declared here: `patch-generated-project.sh`
#   copies `native/arm64-v8a/libsolochain-node.so` into the generated gradle
#   project's jniLibs after `dx` scaffolds it. The generated manifest sets
#   `extractNativeLibs="true"`, so the loader extracts it to
#   `nativeLibraryDir` at install time, where `execve` is permitted
#   (even on Android 10+).
[android]
min_sdk = 26
target_sdk = 34
compile_sdk = 34

# Foreground service keeps the app process (and the node child process)
# alive while the app is backgrounded. dx emits the <service> manifest
# entry; the Kotlin class itself is copied into the gradle module by
# `patch-generated-project.sh` (android/DioxusForegroundService.kt).
foreground_service_types = ["dataSync"]

[android.permissions]
"android.permission.INTERNET" = { description = "Node RPC on localhost" }
"android.permission.WAKE_LOCK" = { description = "Keep the node running while the dashboard is open" }
"android.permission.FOREGROUND_SERVICE_DATA_SYNC" = { description = "Run the node-keeping foreground service" }
"android.permission.POST_NOTIFICATIONS" = { description = "Show the persistent node-running notification" }
